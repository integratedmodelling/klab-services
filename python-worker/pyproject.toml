[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "klab-python-worker"
version = "0.1.0"
description = "Experimental scoped computation-worker protocol, not an embedded k.LAB runtime"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=7,<8", "ruff>=0.16,<1", "build>=1,<2", "mypy>=1.14,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
