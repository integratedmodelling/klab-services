[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "klab-python-client"
version = "0.1.0"
description = "Synchronous Python client for k.LAB scientific services"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "k.LAB"}]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "pytest-cov>=7,<8", "ruff>=0.16,<1"]
local = ["cryptography>=44,<47", "psutil>=5.9,<8"]
throughput = ["rasterio>=1.4,<2"]
analysis = ["numpy>=1.26,<3", "rasterio>=1.4,<2", "xarray>=2024.1,<2027"]
demo = ["Pillow>=10,<13", "imageio-ffmpeg>=0.6,<1"]
notebook = ["nbformat>=5,<6", "nbclient>=0.10,<1", "nbconvert>=7,<8", "ipykernel>=6,<8", "matplotlib>=3.8,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: opt-in acceptance against a configured k.LAB deployment",
           "functional: complete user workflow with verified results and lifecycle",
           "integration: deterministic local HTTP/subprocess integration; not a real k.LAB service stack"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
