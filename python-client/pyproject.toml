[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "klab-python-client"
version = "0.1.0"
description = "Synchronous Python client for k.LAB scientific services"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "k.LAB"}]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: opt-in acceptance against a configured k.LAB deployment"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
