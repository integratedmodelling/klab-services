[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "klab-service-simulator"
version = "0.1.0"
description = "Isolated contract-driven k.LAB development service, never a scientific engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
klab-service-simulator = "klab_simulator.server:main"

[tool.setuptools.package-data]
klab_simulator = ["fixtures/*.json", "fixtures/*.tif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
