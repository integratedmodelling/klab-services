<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#092f2a" />
    <meta name="description" content="Status and capabilities for a k.LAB service" />
    <script>
      (() => {
        const path = window.location.pathname;
        const marker = path.lastIndexOf("/ui/");
        let basePath;
        if (marker >= 0) basePath = path.slice(0, marker + 1);
        else if (path.endsWith("/index.html")) basePath = path.slice(0, -"index.html".length);
        else basePath = path.endsWith("/") ? path : `${path}/`;
        const base = document.createElement("base");
        base.href = basePath;
        document.head.appendChild(base);
      })();
    </script>
    <script type="importmap">
      {
        "imports": {
          "vue": "./assets/klab-webui-api.js",
          "@klab/webui": "./assets/klab-webui-api.js"
        }
      }
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>k.LAB service</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
