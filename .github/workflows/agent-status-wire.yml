name: Agent status wire contract
on:
  pull_request:
    paths: ['klab.core.api/src/main/java/org/integratedmodelling/klab/api/actors/RuntimeAgent.java', 'klab.core.common/src/main/java/org/integratedmodelling/common/data/jackson/**', 'klab.core.common/src/test/**', 'python-client/src/klab_client/agent_status.py', 'python-client/tests/unit/test_agent_status.py', '.github/workflows/agent-status-wire.yml']
  push:
    paths: ['klab.core.api/src/main/java/org/integratedmodelling/klab/api/actors/RuntimeAgent.java', 'klab.core.common/src/main/java/org/integratedmodelling/common/data/jackson/**', 'klab.core.common/src/test/**', 'python-client/src/klab_client/agent_status.py', 'python-client/tests/unit/test_agent_status.py', '.github/workflows/agent-status-wire.yml']
permissions:
  contents: read
jobs:
  java-status-wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -pl klab.core.common -am -Dtest=AgentStatusWireTest,AgentInstantiationRequestSerializationTest,AgentEventBusTest -Dsurefire.failIfNoSpecifiedTests=false test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-status-wire
          path: |
            klab.core.common/target/agent-status-wire-actual.json
            klab.core.common/target/surefire-reports/
