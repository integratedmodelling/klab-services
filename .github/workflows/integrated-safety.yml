name: Installed safety regression (native approval NOT_RUN)

on:
  workflow_dispatch:
  pull_request:
    paths: ['python-client/**', 'developer-tools/klab-service-simulator/**', '.github/workflows/integrated-safety.yml']
  push:
    paths: ['python-client/**', 'developer-tools/klab-service-simulator/**', '.github/workflows/integrated-safety.yml']

permissions:
  contents: read

jobs:
  installed-safety-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/python-client/tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install './python-client[dev,analysis,tabular,notebook,local]' ./python-worker './developer-tools/klab-service-simulator[test]' 'mypy>=1.14,<2'
      - name: Shared runner and explicit safety recipe controls
        run: python -m pytest -q python-client/tests/tools/test_verify_onboarding_matrix.py python-client/tests/tools/test_verify_safety_matrix.py
      - name: Exact installed safety matrix including isolated noextras and offline core
        run: python python-client/tools/verify_safety_matrix.py --capture-current-source --output-directory safety-evidence
      - name: Types and fatal lint
        run: |
          python -m mypy --check-untyped-defs --follow-imports=silent --ignore-missing-imports python-client/tools/verify_safety_matrix.py
          python -m ruff check python-client/tools/verify_safety_matrix.py python-client/tests/integration/test_core_optional_isolation.py --select E9,F63,F7,F82
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-safety-not-native-or-hostilecode-approval
          path: safety-evidence
