name: Experimental shared-read rights (native NOT_RUN)

on:
  workflow_dispatch:
  push:
    paths: ['python-client/src/klab_client/shared_access.py', 'python-client/src/klab_client/__init__.py', 'python-client/tests/unit/test_shared_access.py', 'developer-tools/klab-service-simulator/**', '.github/workflows/shared-access-reference.yml']
  pull_request:
    paths: ['python-client/src/klab_client/shared_access.py', 'python-client/src/klab_client/__init__.py', 'python-client/tests/unit/test_shared_access.py', 'developer-tools/klab-service-simulator/**', '.github/workflows/shared-access-reference.yml']

permissions:
  contents: read

jobs:
  installed-shared-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install './python-client[dev]' ./python-worker './developer-tools/klab-service-simulator[test]' 'mypy>=1.14,<2'
      - name: Public SDK-only receipts, privacy, binding and opt-in guards
        run: python -m pytest -q python-client/tests/unit/test_accepted_documents.py python-client/tests/unit/test_source_validation.py python-client/tests/unit/test_shared_access.py --cov=klab_client --cov-branch --cov-report=json:shared-read-sdk-coverage.json
      - name: Entire new SDK module and all changed SDK decisions unexcluded
        run: python -m pytest -q python-client/tests/unit/test_commits.py python-client/tests/unit/test_input_provenance.py python-client/tests/unit/test_dependency_graphs.py python-client/tests/unit/test_dependencies.py --cov=klab_client --cov-branch --cov-append --cov-report=json:shared-read-sdk-coverage.json
      - name: Enforce unchanged shared-read coverage gate
        run: python -m pytest -q python-client/tests/unit/test_reference_commits.py --cov=klab_client --cov-branch --cov-append --cov-report=json:shared-read-sdk-coverage.json
      - name: Check unchanged shared-read gate
        run: python -m pytest -q python-client/tests/unit/test_copied_composition.py python-client/tests/unit/test_execution_explanations.py --cov=klab_client --cov-branch --cov-append --cov-report=json:shared-read-sdk-coverage.json
      - name: Verify shared-read coverage threshold
        run: python -m pytest -q python-client/tests/unit/test_managed_behaviors.py --cov=klab_client --cov-branch --cov-append --cov-report=json:shared-read-sdk-coverage.json
      - name: Enforce original shared-read threshold
        run: |
          python -m pip install 'numpy>=1.26,<3' 'xarray>=2024.1,<2027'
          python -m pytest -q python-client/tests/unit/test_reference_windows.py python-client/tests/unit/test_reference_window_analysis.py --cov=klab_client --cov-branch --cov-append --cov-report=json:shared-read-sdk-coverage.json
      - name: Preserve shared-read threshold after selected-window controls
        env:
          COVERAGE_BASE: "${{ github.event.pull_request.base.sha || 'HEAD^' }}"
        run: python python-client/tools/check_feature_coverage.py shared-read-sdk-coverage.json --base "$COVERAGE_BASE" --new-module src/klab_client/shared_access.py
      - name: Public sync/nativeasync access, revocation races, lost replies and cleanup
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_shared_access.py --junitxml=shared-read-public-http.xml
      - name: Supplementary independent policy and intake controls
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_shared_access_fixture.py --cov=klab_simulator.shared_access --cov-branch --cov-fail-under=100 --cov-report=json:shared-read-fixture-coverage.json
      - name: Implementation body types and fatal lint
        run: |
          python -m mypy --check-untyped-defs --follow-imports=silent --ignore-missing-imports python-client/src/klab_client/shared_access.py developer-tools/klab-service-simulator/src/klab_simulator/shared_access.py
          python -m ruff check python-client/src developer-tools/klab-service-simulator/src --select E9,F63,F7,F82
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-read-reference-not-native-authorization
          path: |
            shared-read-sdk-coverage.json
            shared-read-public-http.xml
            shared-read-fixture-coverage.json
