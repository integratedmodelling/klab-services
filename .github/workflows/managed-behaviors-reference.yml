name: Managed behavior reference (native execution NOT_RUN)

on:
  workflow_dispatch:
  push:
    paths: ['python-client/src/klab_client/managed_behaviors.py', 'python-client/src/klab_client/__init__.py', 'python-client/tests/unit/test_managed_behaviors.py', 'developer-tools/klab-service-simulator/**', '.github/workflows/managed-behaviors-reference.yml']
  pull_request:
    paths: ['python-client/src/klab_client/managed_behaviors.py', 'python-client/src/klab_client/__init__.py', 'python-client/tests/unit/test_managed_behaviors.py', 'developer-tools/klab-service-simulator/**', '.github/workflows/managed-behaviors-reference.yml']

permissions:
  contents: read

jobs:
  installed-managed-behaviors:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install './python-client[dev]' ./python-worker './developer-tools/klab-service-simulator[test]' 'mypy>=1.14,<2'
      - name: SDK-only source/admission/reconnect/lifecycle/unknown-outcome controls
        run: python -m pytest -q python-client/tests/unit/test_managed_behaviors.py --cov=klab_client --cov-branch --cov-report=json:managed-sdk.json
      - name: Entire new SDK module and changed SDK decisions unexcluded
        run: |
          python -m pip install 'numpy>=1.26,<3' 'xarray>=2024.1,<2027'
          python -m pytest -q python-client/tests/unit/test_reference_windows.py python-client/tests/unit/test_reference_window_analysis.py --cov=klab_client --cov-branch --cov-append --cov-report=json:managed-sdk.json
      - name: Preserve managed behavior threshold after selected-window controls
        env:
          COVERAGE_BASE: "${{ github.event.pull_request.base.sha || 'HEAD^' }}"
        run: python python-client/tools/check_feature_coverage.py managed-sdk.json --base "$COVERAGE_BASE" --new-module src/klab_client/managed_behaviors.py
      - name: Public sync-async source/reconnect/outcome/private-session disposal/owner-survival workflows
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_managed_behavior_workflow.py --junitxml=managed-http.xml
      - name: Independent finite recipe/session policy controls
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_managed_behavior_fixture.py --cov=klab_simulator.managed_behaviors --cov-branch --cov-fail-under=100 --cov-report=json:managed-fixture.json
      - name: Preserve old fixture-only managed-agent lifecycle
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_managed_agents.py
      - name: Types and fatal lint
        run: |
          python -m mypy --check-untyped-defs --follow-imports=silent --ignore-missing-imports python-client/src/klab_client/managed_behaviors.py developer-tools/klab-service-simulator/src/klab_simulator/managed_behaviors.py
          python -m ruff check python-client/src developer-tools/klab-service-simulator/src --select E9,F63,F7,F82
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-behavior-finite-reference-not-native-actor-execution
          path: |
            managed-sdk.json
            managed-http.xml
            managed-fixture.json
