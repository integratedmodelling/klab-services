name: Python SDK simulated service contracts

on:
  workflow_dispatch:
  push:
    paths: ['developer-tools/klab-service-simulator/**', 'python-client/**', 'python-worker/**', '.github/workflows/klab-service-simulator.yml']
  pull_request:
    paths: ['developer-tools/klab-service-simulator/**', 'python-client/**', 'python-worker/**', '.github/workflows/klab-service-simulator.yml']

permissions:
  contents: read

jobs:
  notebook-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact ordinary SDK, notebook extras and separate simulator
        run: python -m pip install './python-client[notebook,local]' './developer-tools/klab-service-simulator[test]'
      - name: Require actual owned-kernel dependencies rather than skip acceptance
        run: python -c "import nbformat, nbclient, ipykernel, psutil"
      - name: Native awaited client notebook over existing isolated HTTP routes
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_notebook_client.py --junitxml=notebook-client-results.xml
      - name: Retain labeled notebook client results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-notebook-client-not-java-science
          path: notebook-client-results.xml
          if-no-files-found: error
  scientific-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install separate simulator and optional scientific client dependencies
        run: python -m pip install './python-client[analysis,tabular]' './developer-tools/klab-service-simulator[test]' 'pytest-cov>=7,<8'
      - name: Require scientific dependencies instead of silently skipping acceptance
        run: python -c "import numpy, pandas, rasterio, xarray"
      - name: Scientific adapters over isolated native HTTP exports and point reads
        run: |
          python -m pytest -q python-client/tests/unit/test_multiband_analysis.py python-client/tests/unit/test_scientific_analysis.py --cov=klab_client --cov-branch --cov-report=json:scientific-coverage.json --junitxml=scientific-unit-results.xml
          python -m pytest -q developer-tools/klab-service-simulator/tests/test_scientific_adapters.py developer-tools/klab-service-simulator/tests/test_declared_bands.py --cov=klab_client --cov-branch --cov-append --cov-report=json:scientific-coverage.json --junitxml=scientific-adapter-results.xml
      - name: Require unexcluded changed-line and branch coverage for scientific adapters
        env:
          COVERAGE_BASE: '${{ github.event.pull_request.base.sha || github.event.before || ''HEAD^'' }}'
        run: python python-client/tools/check_analysis_coverage.py scientific-coverage.json --base "$COVERAGE_BASE"
      - name: Retain scientific adapter results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-scientific-adapters
          path: |
            scientific-adapter-results.xml
            scientific-unit-results.xml
            scientific-coverage.json
          if-no-files-found: error
  simulator-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install production SDK and separately packaged test simulator
        run: python -m pip install ./python-client ./python-worker './developer-tools/klab-service-simulator[test]' setuptools wheel build ruff
      - name: Run clockless state, real HTTP SDK vertical, authentic recorded fixture and pinned replay tests
        # Each vertical case owns an ephemeral-port subprocess and terminates it in finally.
        # No Java, IDE, Neo4j, external service, production credential or paid API is used.
        run: python -m pytest -q developer-tools/klab-service-simulator/tests --junitxml=simulator-results.xml
      - name: Simulator syntax and fatal-error lint
        run: python -m ruff check developer-tools/klab-service-simulator/src developer-tools/klab-service-simulator/tests --select E9,F63,F7,F82
      - name: Build separate simulator artifacts
        run: python -m build --no-isolation developer-tools/klab-service-simulator
      - name: Retain labeled test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-contracts-python-${{ matrix.python }}
          path: simulator-results.xml
          if-no-files-found: error
