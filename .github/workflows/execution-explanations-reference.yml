name: Finite execution explanations (native science NOT_RUN)

on:
  workflow_dispatch:
  push:
    paths: ['python-client/src/klab_client/execution_explanations.py', 'python-client/src/klab_client/__init__.py', 'python-client/tests/unit/test_execution_explanations.py', 'developer-tools/klab-service-simulator/**', '.github/workflows/execution-explanations-reference.yml']
  pull_request:
    paths: ['python-client/src/klab_client/execution_explanations.py', 'python-client/src/klab_client/__init__.py', 'python-client/tests/unit/test_execution_explanations.py', 'developer-tools/klab-service-simulator/**', '.github/workflows/execution-explanations-reference.yml']

permissions:
  contents: read

jobs:
  installed-execution-explanations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install './python-client[dev]' ./python-worker './developer-tools/klab-service-simulator[test]' 'mypy>=1.14,<2'
      - name: SDK-only input/model/component/planned-recorded semantic effect controls
        run: python -m pytest -q python-client/tests/unit/test_execution_explanations.py --cov=klab_client --cov-branch --cov-report=json:explanations-sdk.json
      - name: Entire new SDK module and changed SDK decisions unexcluded
        run: python -m pytest -q python-client/tests/unit/test_copied_composition.py --cov=klab_client --cov-branch --cov-append --cov-report=json:explanations-sdk.json
      - name: Verify unchanged explanation coverage threshold
        env:
          COVERAGE_BASE: "${{ github.event.pull_request.base.sha || 'HEAD^' }}"
        run: python python-client/tools/check_feature_coverage.py explanations-sdk.json --base "$COVERAGE_BASE" --new-module src/klab_client/execution_explanations.py
      - name: Public sync-async actual import/source/plan/observation/400cell explanation and cleanup
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_execution_explanations.py --junitxml=explanations-http.xml
      - name: Independent finite selected source/plan/effect fixture policies
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_execution_explanation_fixture.py --cov=klab_simulator.execution_explanations --cov-branch --cov-fail-under=100 --cov-report=json:explanations-fixture.json
      - name: Preserve existing source-bound graph fixture coverage
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_dependency_graph_fixture.py developer-tools/klab-service-simulator/tests/test_input_provenance_fixture.py --cov=klab_simulator.dependency_graphs --cov-branch --cov-fail-under=100
      - name: Types and fatal lint
        run: |
          python -m mypy --check-untyped-defs --follow-imports=silent --ignore-missing-imports python-client/src/klab_client/execution_explanations.py developer-tools/klab-service-simulator/src/klab_simulator/execution_explanations.py
          python -m ruff check python-client/src developer-tools/klab-service-simulator/src --select E9,F63,F7,F82
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finite-explanations-not-native-scientific-lineage
          path: |
            explanations-sdk.json
            explanations-http.xml
            explanations-fixture.json
