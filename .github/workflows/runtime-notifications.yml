name: Runtime activity notification routing checks

on:
  push:
    paths: ['klab.services.runtime/**', 'klab.core.services/**', '.github/workflows/runtime-notifications.yml']
  pull_request:
    paths: ['klab.services.runtime/**', 'klab.core.services/**', '.github/workflows/runtime-notifications.yml']

permissions:
  contents: read

jobs:
  routing-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test source-matched scope and notification routing regressions
        run: ./mvnw -B -pl klab.services.runtime -am -Pnotification-coverage -Dtest=ContextActivityHintScopeTest,ContextActivityNotificationsTest -Dsurefire.failIfNoSpecifiedTests=false verify
