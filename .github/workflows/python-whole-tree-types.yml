name: Python whole-tree type contracts

on:
  workflow_dispatch:
  pull_request:
    paths: ['python-client/**', 'python-worker/**', 'developer-tools/klab-service-simulator/**', '.github/workflows/python-whole-tree-types.yml']
  push:
    paths: ['python-client/**', 'python-worker/**', 'developer-tools/klab-service-simulator/**', '.github/workflows/python-whole-tree-types.yml']

permissions:
  contents: read

jobs:
  whole-tree-types:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install './python-client[dev,analysis,tabular,local]' ./python-worker './developer-tools/klab-service-simulator[test]' 'mypy>=1.14,<2'
      - name: Check all production SDK, worker and separate reference source bodies
        run: python -m mypy --check-untyped-defs --follow-imports=silent --ignore-missing-imports python-client/src/klab_client python-worker/src/klab_worker developer-tools/klab-service-simulator/src/klab_simulator
      - name: Fatal lint
        run: python -m ruff check python-client/src python-worker/src developer-tools/klab-service-simulator/src --select E9,F63,F7,F82
