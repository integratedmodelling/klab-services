name: Native-shaped commit-cache inspection (convergence NOT_RUN)

on:
  workflow_dispatch:
  push:
    paths: ['python-client/src/klab_client/commits.py', 'python-client/src/klab_client/__init__.py', 'python-client/tests/unit/test_commits.py', 'developer-tools/klab-service-simulator/**', '.github/workflows/commit-inspection.yml']
  pull_request:
    paths: ['python-client/src/klab_client/commits.py', 'python-client/src/klab_client/__init__.py', 'python-client/tests/unit/test_commits.py', 'developer-tools/klab-service-simulator/**', '.github/workflows/commit-inspection.yml']

permissions:
  contents: read

jobs:
  installed-commit-inspection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install './python-client[dev]' ./python-worker './developer-tools/klab-service-simulator[test]' 'mypy>=1.14,<2'
      - name: SDK-only source-defined cached report and identity-refusal controls
        run: python -m pytest -q python-client/tests/unit/test_commits.py --cov=klab_client --cov-branch --cov-report=json:commits-sdk.json
      - name: Entire new SDK module and changed SDK decisions unexcluded
        run: python -m pytest -q python-client/tests/unit/test_reference_commits.py --cov=klab_client --cov-branch --cov-append --cov-report=json:commits-sdk.json
      - name: Check unchanged native-cache coverage gate
        run: python -m pytest -q python-client/tests/unit/test_copied_composition.py python-client/tests/unit/test_execution_explanations.py --cov=klab_client --cov-branch --cov-append --cov-report=json:commits-sdk.json
      - name: Verify native-cache coverage threshold
        run: python -m pytest -q python-client/tests/unit/test_managed_behaviors.py --cov=klab_client --cov-branch --cov-append --cov-report=json:commits-sdk.json
      - name: Enforce original native-cache threshold
        run: |
          python -m pip install 'numpy>=1.26,<3' 'xarray>=2024.1,<2027'
          python -m pytest -q python-client/tests/unit/test_reference_windows.py python-client/tests/unit/test_reference_window_analysis.py --cov=klab_client --cov-branch --cov-append --cov-report=json:commits-sdk.json
      - name: Preserve cache threshold after selected-window controls
        env:
          COVERAGE_BASE: "${{ github.event.pull_request.base.sha || 'HEAD^' }}"
        run: python python-client/tools/check_feature_coverage.py commits-sdk.json --base "$COVERAGE_BASE" --new-module src/klab_client/commits.py
      - name: Public sync-nativeasync completed observation, explicit commit-cache read, expiry and owner cleanup
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_commits.py --junitxml=commits-http.xml
      - name: Supplementary native-shaped finite cache fixture
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_commit_fixture.py --cov=klab_simulator.commits --cov-branch --cov-fail-under=100 --cov-report=json:commits-fixture.json
      - name: Types and fatal lint
        run: |
          python -m mypy --check-untyped-defs --follow-imports=silent --ignore-missing-imports python-client/src/klab_client/commits.py developer-tools/klab-service-simulator/src/klab_simulator/commits.py
          python -m ruff check python-client/src developer-tools/klab-service-simulator/src --select E9,F63,F7,F82
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-shaped-commit-cache-not-full-convergence
          path: |
            commits-sdk.json
            commits-http.xml
            commits-fixture.json
