name: Python client offline checks

on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
  push:
    paths: ['python-client/**', '.github/workflows/python-client.yml']
  pull_request:
    paths: ['python-client/**', '.github/workflows/python-client.yml']

jobs:
  windows-fixture-bytes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest httpx
      - run: python -m pytest -q tests/unit/test_prepare_runtime_fixture.py
        working-directory: python-client
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install './python-client[dev,local,analysis,tabular,vector,notebook,events]'
      - name: Conservative feedback selection rationale (advisory; full gates below remain required)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            python tools/select_scientific_tests.py --git-base "$PR_BASE"
          else
            python tools/select_scientific_tests.py --full
          fi
        working-directory: python-client
      - run: python -m pytest -q tests/unit tests/integration --cov=klab_client --cov=workflows.discover_compare_explain --cov=workflows.milestone --cov=workflows.deployment --cov=build_milestone_deliverable --cov=run_milestone_acceptance --cov=run_milestone_throughput --cov=restore_milestone_results --cov=workflows.resource_inspection --cov=run_resource_inspector_acceptance --cov=check_release_readiness --cov=prepare_runtime_fixture --cov-branch --cov-report=json
        working-directory: python-client
      - run: python tools/check_feature_coverage.py coverage.json --base ad2bc949c167e1c2e370973ce4427fe67cb1cc30 --new-module src/klab_client/requests.py --new-module src/klab_client/handles.py --new-module src/klab_client/exports.py --new-module src/klab_client/connection.py --new-module src/klab_client/connection_models.py --new-module src/klab_client/credentials.py --new-module src/klab_client/_bootstrap.py --new-module src/klab_client/analysis.py --new-module src/klab_client/provenance.py --new-module src/klab_client/semantics.py --new-module src/klab_client/_inspection.py --new-module src/klab_client/inspection.py --new-module src/klab_client/evidence.py --new-module src/klab_client/experiments.py --new-module tools/workflows/discover_compare_explain.py --new-module tools/workflows/milestone.py --new-module tools/workflows/deployment.py --new-module tools/build_milestone_deliverable.py --new-module tools/run_milestone_acceptance.py --new-module tools/run_milestone_throughput.py --new-module tools/restore_milestone_results.py --new-module tools/workflows/resource_inspection.py --new-module tools/run_resource_inspector_acceptance.py
        working-directory: python-client
      - name: Native async transport coverage
        run: python tools/check_feature_coverage.py coverage.json --base ad2bc949c167e1c2e370973ce4427fe67cb1cc30 --new-module src/klab_client/_async_transport.py --new-module src/klab_client/async_client.py
        working-directory: python-client
      - name: Bounded native GeoJSON analysis coverage
        run: python tools/check_feature_coverage.py coverage.json --base ad2bc949c167e1c2e370973ce4427fe67cb1cc30 --new-module src/klab_client/vector.py
        working-directory: python-client
      - name: Scientific table adapter coverage
        run: python tools/check_feature_coverage.py coverage.json --base ad2bc949c167e1c2e370973ce4427fe67cb1cc30 --new-module src/klab_client/tables.py
        working-directory: python-client
      - name: Offline scientific snapshot coverage
        run: python tools/check_feature_coverage.py coverage.json --base ad2bc949c167e1c2e370973ce4427fe67cb1cc30 --new-module src/klab_client/_scientific_snapshot.py
        working-directory: python-client
      - name: Typed graph browser coverage
        run: python tools/check_feature_coverage.py coverage.json --base ad2bc949c167e1c2e370973ce4427fe67cb1cc30 --new-module src/klab_client/graph.py
        working-directory: python-client
      - name: Partial graph projection coverage
        run: python tools/check_feature_coverage.py coverage.json --base ad2bc949c167e1c2e370973ce4427fe67cb1cc30 --new-module src/klab_client/graph_projection.py
        working-directory: python-client
      - name: Release evidence checker coverage
        run: python tools/check_feature_coverage.py coverage.json --base ad2bc949c167e1c2e370973ce4427fe67cb1cc30 --new-module tools/check_release_readiness.py
        working-directory: python-client
      - name: ADD-only authoring coverage
        run: python tools/check_feature_coverage.py coverage.json --base ad2bc949c167e1c2e370973ce4427fe67cb1cc30 --new-module src/klab_client/authoring.py
        working-directory: python-client
      - name: Best-effort activity notification coverage
        run: python tools/check_feature_coverage.py coverage.json --base ad2bc949c167e1c2e370973ce4427fe67cb1cc30 --new-module src/klab_client/notifications.py
        working-directory: python-client
      - name: Read-only source document preview coverage
        run: python tools/check_feature_coverage.py coverage.json --base ad2bc949c167e1c2e370973ce4427fe67cb1cc30 --new-module src/klab_client/source_previews.py
        working-directory: python-client
      - name: Source-only agent preview coverage
        run: python tools/check_feature_coverage.py coverage.json --base ad2bc949c167e1c2e370973ce4427fe67cb1cc30 --new-module src/klab_client/agents.py
        working-directory: python-client
      - name: Agent status payload coverage
        run: python tools/check_feature_coverage.py coverage.json --base ad2bc949c167e1c2e370973ce4427fe67cb1cc30 --new-module src/klab_client/agent_status.py
        working-directory: python-client
      - name: Agent one-shot control journal coverage
        run: python tools/check_feature_coverage.py coverage.json --base ad2bc949c167e1c2e370973ce4427fe67cb1cc30 --new-module src/klab_client/agent_control.py
        working-directory: python-client
      - name: Registered agent execution and native AMQP coverage
        run: python tools/check_feature_coverage.py coverage.json --base ad2bc949c167e1c2e370973ce4427fe67cb1cc30 --new-module src/klab_client/_agent_wire.py --new-module src/klab_client/agent_messaging.py --new-module src/klab_client/agent_execution.py
        working-directory: python-client
      - name: Synthetic Runtime fixture byte-preservation coverage
        run: python tools/check_feature_coverage.py coverage.json --base ad2bc949c167e1c2e370973ce4427fe67cb1cc30 --new-module tools/prepare_runtime_fixture.py
        working-directory: python-client
      - name: Process-local sync and async Job binding coverage
        run: python tools/check_feature_coverage.py coverage.json --base ad2bc949c167e1c2e370973ce4427fe67cb1cc30 --new-module src/klab_client/_job_binding.py
        working-directory: python-client
      - name: Bounded resource upload coverage
        run: python tools/check_feature_coverage.py coverage.json --base ad2bc949c167e1c2e370973ce4427fe67cb1cc30 --new-module src/klab_client/imports.py
        working-directory: python-client
      - run: python -m ruff check src tests examples tools --select E9,F63,F7,F82
        working-directory: python-client
      - run: python -m build
        working-directory: python-client
  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./python-client
      - name: Core installation does not require or import scientific dependencies
        run: |
          python -I - <<'PY'
          import importlib.util
          import sys
          from klab_client import Client, Handle, ExperimentRunner, SemanticExplorer, ResourceInspector, fetch_execution_evidence, ScientificData, to_dataframe
          from klab_client.errors import UnsupportedOperationError
          assert all(importlib.util.find_spec(name) is None for name in ('numpy', 'rasterio', 'xarray', 'pandas', 'geopandas', 'shapely'))
          assert all(name not in sys.modules for name in ('numpy', 'rasterio', 'xarray', 'pandas', 'geopandas', 'shapely'))
          data = ScientificData(1, 'quantity', None, None, (0,), 'UNSPECIFIED', {}, (0,), ('0',), artifact_type='NUMBER')
          try:
              to_dataframe(data)
          except UnsupportedOperationError as error:
              assert '[tabular]' in str(error)
          else:
              raise AssertionError('Core-only install must not invent a pandas replacement')
          with Client('https://runtime.invalid/runtime', 'secret'):
              pass
          handle = Handle('observation', 'home', 'https://runtime.invalid/runtime', 's.c', 's.c', observation_id=42)
          assert Handle.loads(handle.dumps()) == handle
          assert ScientificData.loads(data.dumps()).values == (0,)
          PY
