name: Installed scientific snapshots (real provider science NOT_RUN)

on:
  workflow_dispatch:
  pull_request:
    paths: ['python-client/**', 'developer-tools/klab-service-simulator/**', '.github/workflows/integrated-scientific-snapshots.yml']
  push:
    paths: ['python-client/**', 'developer-tools/klab-service-simulator/**', '.github/workflows/integrated-scientific-snapshots.yml']

permissions:
  contents: read

jobs:
  installed-scientific-snapshot-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/python-client/tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install './python-client[dev,analysis,tabular,notebook,local]' ./python-worker './developer-tools/klab-service-simulator[test]' 'mypy>=1.14,<2'
      - name: Require optional dependencies rather than skipped acceptance
        run: python -c "import numpy,pandas,rasterio,xarray,psutil"
      - name: Runner and reference-science recipe controls
        run: python -m pytest -q python-client/tests/tools/test_verify_onboarding_matrix.py python-client/tests/tools/test_verify_scientific_matrix.py python-client/tests/tools/test_verify_restoration_matrix.py python-client/tests/tools/test_verify_notebook_matrix.py
      - name: Installed multishard, frozen-recorded and offline known-answer matrix
        run: python python-client/tools/verify_scientific_matrix.py --capture-current-source --output-directory scientific-snapshot-evidence
      - name: Shared-runner onboarding regression
        run: python python-client/tools/verify_onboarding_matrix.py --capture-current-source --output-directory onboarding-regression-evidence
      - name: Types and fatal lint
        run: |
          python -m mypy --check-untyped-defs --follow-imports=silent --ignore-missing-imports python-client/tools/verify_onboarding_matrix.py python-client/tools/verify_scientific_matrix.py
          python -m ruff check python-client/tools/verify_onboarding_matrix.py python-client/tools/verify_scientific_matrix.py --select E9,F63,F7,F82
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-snapshots-not-real-provider-science
          path: |
            scientific-snapshot-evidence
            onboarding-regression-evidence
