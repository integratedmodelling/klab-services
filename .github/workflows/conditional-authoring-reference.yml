name: Experimental conditional source publication (native NOT_RUN)

on:
  workflow_dispatch:
  push:
    paths: ['python-client/src/klab_client/accepted_documents.py', 'python-client/src/klab_client/__init__.py', 'python-client/tests/unit/test_accepted_documents.py', 'developer-tools/klab-service-simulator/**', '.github/workflows/conditional-authoring-reference.yml']
  pull_request:
    paths: ['python-client/src/klab_client/accepted_documents.py', 'python-client/src/klab_client/__init__.py', 'python-client/tests/unit/test_accepted_documents.py', 'developer-tools/klab-service-simulator/**', '.github/workflows/conditional-authoring-reference.yml']

permissions:
  contents: read

jobs:
  installed-conditional-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install './python-client[dev]' ./python-worker './developer-tools/klab-service-simulator[test]' 'mypy>=1.14,<2'
      - name: Public SDK-only conditions, immutable receipts, privacy and binding guards
        run: python -m pytest -q python-client/tests/unit/test_accepted_documents.py --cov=klab_client --cov-branch --cov-report=json:conditional-source-sdk.json
      - name: Whole new module and all changed SDK decisions unexcluded
        run: python -m pytest -q python-client/tests/unit/test_commits.py python-client/tests/unit/test_input_provenance.py python-client/tests/unit/test_dependency_graphs.py python-client/tests/unit/test_dependencies.py --cov=klab_client --cov-branch --cov-append --cov-report=json:conditional-source-sdk.json
      - name: Enforce unchanged conditional source coverage gate
        run: python -m pytest -q python-client/tests/unit/test_reference_commits.py --cov=klab_client --cov-branch --cov-append --cov-report=json:conditional-source-sdk.json
      - name: Check unchanged conditional source gate
        run: python -m pytest -q python-client/tests/unit/test_copied_composition.py python-client/tests/unit/test_execution_explanations.py --cov=klab_client --cov-branch --cov-append --cov-report=json:conditional-source-sdk.json
      - name: Verify conditional source coverage threshold
        run: python -m pytest -q python-client/tests/unit/test_managed_behaviors.py --cov=klab_client --cov-branch --cov-append --cov-report=json:conditional-source-sdk.json
      - name: Enforce original conditional source threshold
        run: |
          python -m pip install 'numpy>=1.26,<3' 'xarray>=2024.1,<2027' 'rasterio>=1.4,<2'
          python -m pytest -q python-client/tests/unit/test_reference_windows.py python-client/tests/unit/test_reference_window_analysis.py python-client/tests/unit/test_reference_raster_labels.py python-client/tests/unit/test_reference_raster_analysis.py --cov=klab_client --cov-branch --cov-append --cov-report=json:conditional-source-sdk.json
      - name: Preserve conditional threshold after selected-window controls
        env:
          COVERAGE_BASE: "${{ github.event.pull_request.base.sha || 'HEAD^' }}"
        run: |
          python -m pytest -q python-client/tests/unit --cov=klab_client --cov-branch --cov-append --cov-report=json:conditional-source-sdk.json
          python python-client/tools/check_feature_coverage.py conditional-source-sdk.json --base "$COVERAGE_BASE" --new-module src/klab_client/accepted_documents.py
      - name: Independent public sync/nativeasync source lifecycle and lost reply recovery
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_accepted_documents.py --junitxml=conditional-source-http.xml
      - name: Supplementary finite service intake and server-owned conditions
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_accepted_document_fixture.py --cov=klab_simulator.accepted_documents --cov-branch --cov-fail-under=100 --cov-report=json:conditional-source-fixture.json
      - name: Implementation-body types and fatal lint
        run: |
          python -m mypy --check-untyped-defs --follow-imports=silent --ignore-missing-imports python-client/src/klab_client/accepted_documents.py developer-tools/klab-service-simulator/src/klab_simulator/accepted_documents.py
          python -m ruff check python-client/src developer-tools/klab-service-simulator/src --select E9,F63,F7,F82
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conditional-source-reference-not-native-publication
          path: |
            conditional-source-sdk.json
            conditional-source-http.xml
            conditional-source-fixture.json
