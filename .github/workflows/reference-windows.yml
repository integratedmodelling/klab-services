name: Selected finite reference windows (native NOT_RUN)

on:
  workflow_dispatch:
  push:
    paths: ['python-client/**', 'developer-tools/klab-service-simulator/**', '.github/workflows/reference-windows.yml']
  pull_request:
    paths: ['python-client/**', 'developer-tools/klab-service-simulator/**', '.github/workflows/reference-windows.yml']

permissions:
  contents: read

jobs:
  installed-reference-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install './python-client[dev,analysis]' ./python-worker './developer-tools/klab-service-simulator[test]' 'mypy>=1.14,<2'
      - name: SDK and detached analysis controls
        run: python -m pytest -q python-client/tests/unit/test_reference_windows.py python-client/tests/unit/test_reference_window_analysis.py python-client/tests/unit/test_reference_raster_labels.py python-client/tests/unit/test_reference_raster_analysis.py --cov=klab_client --cov-branch --cov-report=json:windows-sdk.json
      - name: Entire module and changed SDK decisions unexcluded
        env:
          COVERAGE_BASE: "${{ github.event.pull_request.base.sha || 'HEAD^' }}"
        run: |
          python -m pytest -q python-client/tests/unit --cov=klab_client --cov-branch --cov-append --cov-report=json:windows-sdk.json
          python python-client/tools/check_feature_coverage.py windows-sdk.json --base "$COVERAGE_BASE" --new-module src/klab_client/reference_windows.py
      - name: Actual public sync-async state-window workflows
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_reference_windows.py --junitxml=windows-http.xml
      - name: Independent fixture policy
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_reference_window_fixture.py --cov=klab_simulator.reference_windows --cov-branch --cov-fail-under=100 --cov-report=json:windows-fixture.json
      - name: Preserve full read and offline analysis semantics
        run: |
          python -m pytest -q python-client/tests/unit/test_read_plans.py python-client/tests/unit/test_read_plan_analysis.py
          python -m pytest -q developer-tools/klab-service-simulator/tests/test_read_plans.py
      - name: Types and fatal lint
        run: |
          python -m mypy --check-untyped-defs --follow-imports=silent --ignore-missing-imports python-client/src/klab_client/reference_windows.py developer-tools/klab-service-simulator/src/klab_simulator/reference_windows.py
          python -m ruff check python-client/src developer-tools/klab-service-simulator/src --select E9,F63,F7,F82
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-window-reference-not-native-time
          path: |
            windows-sdk.json
            windows-http.xml
            windows-fixture.json
