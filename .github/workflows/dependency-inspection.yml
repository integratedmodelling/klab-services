name: Native-shaped dependency membership (complete graph NOT_RUN)

on:
  workflow_dispatch:
  push:
    paths: ['python-client/src/klab_client/dependencies.py', 'python-client/src/klab_client/__init__.py', 'python-client/tests/unit/test_dependencies.py', 'developer-tools/klab-service-simulator/**', '.github/workflows/dependency-inspection.yml']
  pull_request:
    paths: ['python-client/src/klab_client/dependencies.py', 'python-client/src/klab_client/__init__.py', 'python-client/tests/unit/test_dependencies.py', 'developer-tools/klab-service-simulator/**', '.github/workflows/dependency-inspection.yml']

permissions:
  contents: read

jobs:
  installed-dependency-membership:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install './python-client[dev]' ./python-worker './developer-tools/klab-service-simulator[test]' 'mypy>=1.14,<2'
      - name: Public SDK-only membership and honest completeness/security controls
        run: python -m pytest -q python-client/tests/unit/test_dependencies.py --cov=klab_client --cov-branch --cov-report=json:dependency-sdk.json
      - name: Require entire new SDK module and all changed SDK decisions unexcluded
        env:
          COVERAGE_BASE: "${{ github.event.pull_request.base.sha || 'HEAD^' }}"
        run: python python-client/tools/check_feature_coverage.py dependency-sdk.json --base "$COVERAGE_BASE" --new-module src/klab_client/dependencies.py
      - name: Independent public sync/nativeasync grouped membership and changed versions
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_dependencies.py --junitxml=dependency-http.xml
      - name: Supplementary finite group fixture
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_dependency_fixture.py --cov=klab_simulator.dependencies --cov-branch --cov-fail-under=100 --cov-report=json:dependency-fixture.json
      - name: Implementation body types and fatal lint
        run: |
          python -m mypy --check-untyped-defs --follow-imports=silent --ignore-missing-imports python-client/src/klab_client/dependencies.py developer-tools/klab-service-simulator/src/klab_simulator/dependencies.py
          python -m ruff check python-client/src developer-tools/klab-service-simulator/src --select E9,F63,F7,F82
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-membership-not-edge-complete-graph
          path: |
            dependency-sdk.json
            dependency-http.xml
            dependency-fixture.json
