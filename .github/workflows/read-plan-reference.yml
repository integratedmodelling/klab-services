name: Experimental snapshot shards (native NOT_RUN)

on:
  workflow_dispatch:
  push:
    paths: ['python-client/src/klab_client/read_plans.py', 'python-client/tests/unit/test_read_plans.py', 'developer-tools/klab-service-simulator/src/klab_simulator/read_plans.py', 'developer-tools/klab-service-simulator/tests/test_read_plans.py', '.github/workflows/read-plan-reference.yml']
  pull_request:
    paths: ['python-client/src/klab_client/read_plans.py', 'python-client/tests/unit/test_read_plans.py', 'developer-tools/klab-service-simulator/src/klab_simulator/read_plans.py', 'developer-tools/klab-service-simulator/tests/test_read_plans.py', '.github/workflows/read-plan-reference.yml']

permissions:
  contents: read

jobs:
  installed-plans:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install separate SDK and development reference
        run: python -m pip install './python-client[dev]' ./python-worker './developer-tools/klab-service-simulator[test]' 'mypy>=1.14,<2'
      - name: SDK-only sync and native async wire coverage
        run: python -m pytest -q python-client/tests/unit/test_read_plans.py --cov=klab_client --cov-branch --cov-report=json:plans-coverage.json --junitxml=plans-unit.xml
      - name: Owned HTTP, restart fencing, budgets and save rollback
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_read_plans.py developer-tools/klab-service-simulator/tests/test_durable_recovery.py --junitxml=plans-http.xml
      - name: Require unexcluded full new-module coverage without simulator tests
        run: |
          python -m pip install 'numpy>=1.26,<3' 'xarray>=2024.1,<2027'
          python -m pytest -q python-client/tests/unit/test_reference_windows.py python-client/tests/unit/test_reference_window_analysis.py --cov=klab_client --cov-branch --cov-append --cov-report=json:plans-coverage.json
      - name: Preserve original read-plan and changed SDK coverage threshold
        env:
          COVERAGE_BASE: "${{ github.event.pull_request.base.sha || 'HEAD^' }}"
        run: python python-client/tools/check_feature_coverage.py plans-coverage.json --base "$COVERAGE_BASE" --new-module src/klab_client/read_plans.py
      - name: Check implementation bodies
        run: python -m mypy --check-untyped-defs --follow-imports=silent --ignore-missing-imports python-client/src/klab_client/read_plans.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: read-plan-reference-native-NOT_RUN
          path: |
            plans-unit.xml
            plans-http.xml
            plans-coverage.json
