name: Source-defined provider binary workflow (native NOT_RUN)

on:
  workflow_dispatch:
  push:
    paths: ['python-client/src/**', 'python-client/tests/unit/test_provider*.py', 'developer-tools/klab-service-simulator/**', '.github/workflows/provider-binary-data.yml']
  pull_request:
    paths: ['python-client/src/**', 'python-client/tests/unit/test_provider*.py', 'developer-tools/klab-service-simulator/**', '.github/workflows/provider-binary-data.yml']

permissions:
  contents: read

jobs:
  installed-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ordinary SDK, separate simulator and development-only independent oracle
        run: python -m pip install './python-client[dev]' ./python-worker './developer-tools/klab-service-simulator[test]' 'fastavro==1.13.1' 'mypy>=1.14,<2'
      - name: Check golden bytes against generated Java schema through independent oracle
        run: python developer-tools/klab-service-simulator/tools/generate_provider_avro_fixture.py --check
      - name: SDK-only codec, Job, media, binary transport and regression controls
        run: python -m pytest -q python-client/tests/unit/test_material_selections.py python-client/tests/unit/test_selections.py python-client/tests/unit/test_geometry_size.py python-client/tests/unit/test_provider_avro.py python-client/tests/unit/test_provider_data.py python-client/tests/unit/test_provider_handles.py python-client/tests/unit/test_saved_handles.py python-client/tests/unit/test_async_saved_handles.py python-client/tests/unit/test_client.py python-client/tests/unit/test_async_client.py python-client/tests/unit/test_async_transport.py --cov=klab_client --cov-branch --cov-report=json:provider-coverage.json --junitxml=provider-unit.xml
      - name: Independent finite HTTP provider workflow
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_provider_avro.py --junitxml=provider-http.xml
      - name: Entire new SDK modules and changed code coverage
        env:
          COVERAGE_BASE: "${{ github.event.pull_request.base.sha || 'HEAD^' }}"
        run: python python-client/tools/check_feature_coverage.py provider-coverage.json --base "$COVERAGE_BASE" --new-module src/klab_client/_provider_avro.py --new-module src/klab_client/provider_data.py
      - name: Typecheck implementation bodies
        run: python -m mypy --check-untyped-defs --follow-imports=silent --ignore-missing-imports python-client/src/klab_client/_provider_avro.py python-client/src/klab_client/provider_data.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-binary-data-not-native-execution
          path: |
            provider-coverage.json
            provider-unit.xml
            provider-http.xml
