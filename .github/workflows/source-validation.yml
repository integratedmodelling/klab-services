name: Revision-aware namespace diagnostics (native NOT_RUN)

on:
  workflow_dispatch:
  push:
    paths: ['python-client/src/klab_client/source_validation.py', 'python-client/src/klab_client/__init__.py', 'python-client/tests/unit/test_source_validation.py', 'developer-tools/klab-service-simulator/**', '.github/workflows/source-validation.yml']
  pull_request:
    paths: ['python-client/src/klab_client/source_validation.py', 'python-client/src/klab_client/__init__.py', 'python-client/tests/unit/test_source_validation.py', 'developer-tools/klab-service-simulator/**', '.github/workflows/source-validation.yml']

permissions:
  contents: read

jobs:
  installed-source-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install './python-client[dev]' ./python-worker './developer-tools/klab-service-simulator[test]' 'mypy>=1.14,<2'
      - name: Public SDK-only source/version/revision and identity refusals
        run: python -m pytest -q python-client/tests/unit/test_accepted_documents.py python-client/tests/unit/test_source_validation.py --cov=klab_client --cov-branch --cov-report=json:source-validation-sdk.json
      - name: Entire new module and changed SDK decisions unexcluded
        run: python -m pytest -q python-client/tests/unit/test_commits.py python-client/tests/unit/test_input_provenance.py python-client/tests/unit/test_dependency_graphs.py python-client/tests/unit/test_dependencies.py --cov=klab_client --cov-branch --cov-append --cov-report=json:source-validation-sdk.json
      - name: Enforce unchanged namespace validation coverage gate
        env:
          COVERAGE_BASE: "${{ github.event.pull_request.base.sha || 'HEAD^' }}"
        run: python python-client/tools/check_feature_coverage.py source-validation-sdk.json --base "$COVERAGE_BASE" --new-module src/klab_client/source_validation.py
      - name: Independent public sync/nativeasync parse, diagnostics and explicit revalidation
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_source_validation.py --junitxml=source-validation-http.xml
      - name: Supplementary finite reference intake
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_source_validation_fixture.py --cov=klab_simulator.source_validation --cov-branch --cov-fail-under=100 --cov-report=json:source-validation-fixture.json
      - name: Implementation-body typing and fatal lint
        run: |
          python -m mypy --check-untyped-defs --follow-imports=silent --ignore-missing-imports python-client/src/klab_client/source_validation.py developer-tools/klab-service-simulator/src/klab_simulator/source_validation.py
          python -m ruff check python-client/src developer-tools/klab-service-simulator/src --select E9,F63,F7,F82
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: namespace-diagnostics-not-native-acceptance
          path: |
            source-validation-sdk.json
            source-validation-http.xml
            source-validation-fixture.json
