name: Owned bootstrap and mixed Runtime recovery (native NOT_RUN)

on:
  workflow_dispatch:
  push:
    paths: ['developer-tools/klab-service-simulator/tests/conftest.py', 'developer-tools/klab-service-simulator/tests/test_bootstrap_recovery.py', '.github/workflows/bootstrap-recovery.yml']
  pull_request:
    paths: ['developer-tools/klab-service-simulator/tests/conftest.py', 'developer-tools/klab-service-simulator/tests/test_bootstrap_recovery.py', '.github/workflows/bootstrap-recovery.yml']

permissions:
  contents: read

jobs:
  installed-bootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing SDK and separate owned reference
        run: python -m pip install './python-client[dev]' ./python-worker './developer-tools/klab-service-simulator[test]'
      - name: Local SDK expiry and actual owned-process outage controls
        run: python -m pytest -q developer-tools/klab-service-simulator/tests/test_bootstrap_recovery.py --junitxml=bootstrap-recovery.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owned-bootstrap-recovery-${{ matrix.os }}-native-NOT_RUN
          path: bootstrap-recovery.xml
