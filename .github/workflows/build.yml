name: Build and test

on:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v3
    - name: Java setup
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'maven'
    # The declared packaging plugin snapshot is no longer available from the
    # configured public repository. Build that same version from immutable
    # official source rather than depending on a runner's stale Maven cache.
    - name: Checkout pinned packaging plugin
      uses: actions/checkout@v3
      with:
        repository: integratedmodelling/klab.product
        ref: 0c80acb1f16a1d405f888cf99286d6e365293559
        path: .ci/klab-product
        persist-credentials: false
    - name: Bootstrap packaging plugin from source
      run: |
        ./mvnw -B --no-transfer-progress -pl klab.core.api -am install -DskipTests
        ./mvnw -B --no-transfer-progress -f .ci/klab-product/pom.xml install
    - name: Build with maven
      run: ./mvnw -B -U clean package -DskipTests
    - name: Project authorization HTTP regression
      run: ./mvnw -B -pl klab.services.resources -am -Dtest=KlabErrorHandlerTest,ResourceCreationAuthorizationTest -Dsurefire.failIfNoSpecifiedTests=false test
